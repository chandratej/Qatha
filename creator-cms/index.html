<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Suppress unload permissions policy violation (common from libs using beforeunload/unload for cleanup) -->
    <meta http-equiv="Permissions-Policy" content="unload=()" />
    <title>కథ Creator Studio</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          if (localStorage.getItem('katha-cms-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
