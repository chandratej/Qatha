<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C4A052" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Katha Creator Studio — craft Telugu stories that stay with readers. Fair revenue share. No ads. No coins."
    />
    <meta name="application-name" content="Katha Creator Studio" />
    <meta property="og:title" content="కథ · Creator Studio" />
    <meta
      property="og:description"
      content="The writer’s studio for Telugu serialized fiction. Craft with pride. Publish with care."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <!-- Suppress unload permissions policy violation (common from libs using beforeunload/unload for cleanup) -->
    <meta http-equiv="Permissions-Policy" content="unload=()" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Newsreader:ital,wght@0,400;0,500;1,400&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Serif+Telugu:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>కథ · Creator Studio</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          if (localStorage.getItem('katha-cms-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
