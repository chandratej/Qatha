<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Katha">
  <defs>
    <linearGradient id="seal" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8D5A3"/>
      <stop offset="0.45" stop-color="#C4A052"/>
      <stop offset="1" stop-color="#9A7B3A"/>
    </linearGradient>
    <linearGradient id="rim" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDF8F0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6B2338" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <!-- Soft outer disc -->
  <circle cx="32" cy="32" r="30" fill="url(#seal)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <!-- Inner manuscript ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#FDF8F0" stroke-opacity="0.28" stroke-width="1"/>
  <!-- Telugu mark క -->
  <text
    x="32"
    y="38.5"
    text-anchor="middle"
    font-family="'Noto Serif Telugu', 'Noto Sans Telugu', Georgia, serif"
    font-size="28"
    font-weight="700"
    fill="#FDF8F0"
  >క</text>
</svg>
