name: storyverse
description: A premium storytelling, narration, and literary competition platform where stories compete for survival through reader engagement and quality metrics.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.8
  firebase_messaging: ^14.7.9

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  shared_preferences: ^2.2.2

  # Audio
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  just_audio_background: ^0.0.1-beta.12

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^4.2.1
  smooth_page_indicator: ^1.1.0
  lottie: ^3.0.0
  flutter_svg: ^2.0.9
  badges: ^3.1.2
  flutter_rating_bar: ^4.0.1
  readmore: ^3.0.0
  auto_size_text: ^3.0.0
  timeago: ^3.6.1
  google_fonts: ^6.1.0
  animations: ^2.0.8
  flutter_animate: ^4.3.0
  confetti: ^0.7.0
  flutter_slidable: ^3.0.1
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^4.0.0
  visibility_detector: ^0.4.0+2
  wakelock_plus: ^1.1.4

  # Payments
  in_app_purchase: ^3.1.13
  purchases_flutter: ^6.21.0
  razorpay_flutter: ^1.3.6

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^5.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  equatable: ^2.0.5
  dartz: ^0.10.1
  get_it: ^7.6.4
  injectable: ^2.3.2
  freezed_annotation: ^2.4.1
  collection: ^1.18.0
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  url_launcher: ^6.2.4
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  connectivity_plus: ^5.0.2
  package_info_plus: ^6.0.0
  device_info_plus: ^10.0.0
  permission_handler: ^11.3.0
  flutter_secure_storage: ^9.0.0
  encrypt: ^5.0.3
  crypto: ^3.0.3
  local_auth: ^2.1.8
  flutter_html: ^3.0.0-beta.2
  markdown: ^7.2.1
  html: ^0.15.4
  rxdart: ^0.27.7
  async: ^2.11.0
  meta: ^1.10.0
  timezone: ^0.9.2
  screenshot: ^2.3.0
  pdf: ^3.10.7
  printing: ^5.11.1

  # Rich Text Editor
  flutter_quill: ^8.0.0

  # Charts & Analytics
  fl_chart: ^0.66.0

  # Search (Algolia ready)
  algoliasearch: ^1.1.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Localization
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  injectable_generator: ^2.4.1
  retrofit_generator: ^8.0.6
  hive_generator: ^2.0.1
  isar_generator: ^3.1.0+1
  mockito: ^5.4.4
  mocktail: ^1.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/audio/
    - assets/fonts/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
