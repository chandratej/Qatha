# Render Blueprint at monorepo root — free-tier API for Mode B beta
# New → Blueprint → connect repo → select this file

services:
  - type: web
    name: katha-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MOCK_MODE
        value: "false"
      - key: CREATOR_SHARE_PCT
        value: "40"
      - key: LAUNCH_OFFER_MODE
        value: immediate
      - key: KATHA_UNPROVEN_FREE_CHAPTERS
        value: "12"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SPI_BATCH_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://studio.katha.in,https://katha.app
